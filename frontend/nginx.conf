server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64m;  # EPUBs routinely run past nginx's 1m default

  # Docker's embedded DNS, resolved per request — nginx otherwise resolves upstreams
  # once at startup and refuses to boot if the api container is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/ {
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
